<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6dcc0;--card:#f8f3e3;--tx:#1f2333;--mu:#5f627a;--bd:#cdbf98;--ac:#1b2a5c;--ac2:#dcdcea;--ok:#2f7d3a;--pt:#ffffff;--hd:linear-gradient(135deg,#243a80,#14204a)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121829;--card:#1b2340;--tx:#efe9d2;--mu:#a9b0c8;--bd:#2c3760;--ac:#a9bcff;--ac2:#27325c;--ok:#2f8f4a;--pt:#0e1530;--hd:linear-gradient(135deg,#1d2b63,#0f1838)}}
:root[data-theme="dark"]{--bg:#121829;--card:#1b2340;--tx:#efe9d2;--mu:#a9b0c8;--bd:#2c3760;--ac:#a9bcff;--ac2:#27325c;--ok:#2f8f4a;--pt:#0e1530;--hd:linear-gradient(135deg,#1d2b63,#0f1838)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0}.sub{color:var(--mu);font-size:.85rem}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;background:var(--hd);color:#f3e9c4;border-radius:16px;padding:14px 16px;border-bottom:4px solid #b8962e}.hd .sub{color:#e6d9a8}.hd .b{background:rgba(255,255,255,.12);color:#f6efd6;border-color:rgba(255,255,255,.3)}
input,select,button{font:inherit;color:inherit}
.in{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.in:focus{outline:2px solid var(--ac);border-color:transparent}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row select{flex:1;min-width:140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--ac);color:#fff8e0;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;gap:12px}
.av{width:64px;height:64px;border-radius:50%;flex:none;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:1.2rem;cursor:pointer;position:relative;overflow:hidden;border:0;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
.av i{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;text-align:center;font-style:normal;padding:1px 0}
.nm{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.rk{display:inline-block;background:var(--ac2);color:var(--ac);font-size:.72rem;font-weight:700;border-radius:6px;padding:0 7px;margin-right:6px}
.m{font-size:.82rem;color:var(--mu);margin-top:2px;overflow-wrap:anywhere}.m b{color:var(--tx);font-weight:600}
.ac{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.b{border:1px solid var(--bd);background:transparent;border-radius:10px;padding:6px 12px;font-size:.82rem;text-decoration:none;color:var(--tx);cursor:pointer}
.b.p{background:var(--ac);color:var(--pt);border-color:var(--ac)}.b.w{background:var(--ok);color:#fff;border-color:var(--ok)}
.gate{max-width:380px;margin:18vh auto 0;text-align:center}.gate .in{margin:14px 0 10px;text-align:center}
.gate .b{width:100%;padding:12px}.err{color:#dc2626;font-size:.85rem;min-height:1.2em}
.mo{text-align:center;margin:16px}.hide{display:none!important}
</style></head><body><div class="wrap">
